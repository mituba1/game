<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Search Test</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, "Noto Sans JP", sans-serif;
      color: #202124;
      background: #fff;
      display: flex;
      flex-direction: column;
    }
    header {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 18px;
      padding: 14px 20px;
      font-size: 13px;
    }
    header a { color: #202124; text-decoration: none; }
    .avatar {
      width: 32px; height: 32px; border-radius: 50%;
      background: #1a73e8; color: white;
      display: grid; place-items: center; font-weight: bold;
    }
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 115px;
    }
    .logo {
      font-size: clamp(58px, 10vw, 88px);
      font-weight: 600;
      letter-spacing: -6px;
      margin-bottom: 28px;
    }
    .b { color:#4285f4; } .r { color:#ea4335; }
    .y { color:#fbbc05; } .g { color:#34a853; }
    .search {
      width: min(584px, calc(100% - 40px));
      height: 46px;
      border: 1px solid #dfe1e5;
      border-radius: 24px;
      display: flex;
      align-items: center;
      padding: 0 17px;
      box-shadow: 0 1px 2px rgba(60,64,67,.08);
    }
    .search:hover { box-shadow: 0 1px 6px rgba(32,33,36,.20); }
    .search span { color:#9aa0a6; margin-right: 12px; }
    .search input {
      flex: 1; border: 0; outline: 0; font-size: 16px; background: transparent;
    }
    .buttons { margin-top: 28px; display: flex; gap: 12px; }
    button {
      border: 1px solid #f8f9fa;
      border-radius: 4px;
      background: #f8f9fa;
      color: #3c4043;
      padding: 10px 16px;
      font-size: 14px;
      cursor: pointer;
    }
    button:hover { border-color:#dadce0; box-shadow:0 1px 1px rgba(0,0,0,.1); }
    .note { margin-top: 24px; font-size: 13px; color:#5f6368; }
    footer { background:#f2f2f2; color:#70757a; padding: 15px 30px; font-size:14px; }
  </style>
</head>
<body>
  <header><a href="#">Gmail</a><a href="#">画像</a><div class="avatar">M</div></header>
  <main>
    <div class="logo" aria-label="Search Test"><span class="b">G</span><span class="r">o</span><span class="y">o</span><span class="b">g</span><span class="g">l</span><span class="r">e</span></div>
    <div class="search"><span>⌕</span><input aria-label="検索" type="text"></div>
    <div class="buttons"><button>Google 検索</button><button>I'm Feeling Lucky</button></div>
    <div class="note">GitHub連携テスト用ページです。</div>
  </main>
  <footer>日本</footer>
</body>
</html>
